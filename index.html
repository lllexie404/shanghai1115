<title>上海一日 · 文件入口</title>
<style>
  :root{--bg:#060c0a;--panel:#0b1512;--line:#1d3a2f;--line2:#2a5344;
        --grn:#4dff9e;--grn-d:#26c47b;--sil:#cdd9d5;--sil-d:#7d948c}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--sil);min-height:100vh;
    font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:22px 16px 40px;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:9;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.20) 0 1px,rgba(0,0,0,0) 1px 3px)}
  .wrap{max-width:520px;margin:0 auto}
  .hud{display:flex;justify-content:space-between;font-family:Consolas,monospace;
       font-size:12px;color:var(--grn-d);letter-spacing:2px;margin-bottom:14px}
  .hud .p2{border:2px solid var(--grn-d);padding:1px 8px;color:var(--grn)}
  h1{font-size:21px;margin:0 0 6px;color:#e9fff6;letter-spacing:2px;
     text-shadow:0 0 16px rgba(77,255,158,.4)}
  p.sub{font-size:12.5px;color:var(--grn-d);margin:0 0 20px}
  a.tile{
    display:block;text-decoration:none;color:inherit;
    background:var(--panel);border:2px solid var(--line2);
    padding:16px;margin-bottom:11px;
  }
  a.tile:active{border-color:var(--grn);background:#0a2419}
  a.tile .n{display:block;font-weight:700;font-size:16px;color:#e9fff6}
  a.tile .d{display:block;font-size:12.5px;color:var(--sil-d);margin-top:5px}
  a.tile.primary{border-color:var(--grn-d);background:#0a2419}
  .note{font-size:12px;color:var(--sil-d);margin-top:18px;line-height:1.7;
        border-top:1px dashed var(--line2);padding-top:14px}
</style>
</head>
